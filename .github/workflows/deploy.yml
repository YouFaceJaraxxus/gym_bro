name: Deploy

# Runs after CI passes on a push to main (CI's path filters decide whether a
# commit ships at all), or by hand from the Actions tab. Order: database
# migrations → edge functions → Android APK, so a published app never talks to
# an older API.
#
# Secrets (Settings → Environments → "production"):
#   PROD_DATABASE_URL       Session pooler URL (port 5432) of the hosted project,
#                           password %-encoded. Runners are IPv4-only, so it must
#                           be the pooler host, not db.<ref>.supabase.co.
#   SUPABASE_ACCESS_TOKEN   Personal access token (supabase.com/dashboard/account/tokens).
#   ANDROID_KEYSTORE_B64    Optional: base64 of the upload keystore (.jks).
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                           Optional, go with the keystore. Without them the APK
#                           is signed with the runner's throwaway debug key, so
#                           every build has a new signature and Android refuses
#                           to install it over the previous one.
#   MOBILE_DART_DEFINES_JSON  Optional: JSON object of extra dart-defines
#                           (FIREBASE_*, GOOGLE_SERVER_CLIENT_ID); API_BASE_URL
#                           is set from SUPABASE_PROJECT_REF below.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Queue deploys; never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.6
  SUPABASE_CLI_VERSION: 2.84.2
  # setup-cli points the CLI at ghcr.io unless this is set, and ghcr.io answers
  # runner image pulls with `toomanyrequests`. ECR Public is the CLI's own default.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
  SUPABASE_PROJECT_REF: zbrdpjlnkbuddowbfptf
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  backend:
    name: Backend (migrations, edge functions)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/gym_bro_api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -n "$PROD_DATABASE_URL" ] || missing="$missing PROD_DATABASE_URL"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          ./scripts/migrate.sh --status | tee /tmp/migrate-status.txt
          # migrate.sh never re-runs an applied file, so an edit to one doesn't reach prod.
          grep 'file changed since it was applied' /tmp/migrate-status.txt | while read -r line; do
            echo "::warning::$line — edits to applied migrations are not re-run; put the change in a new file."
          done
          ./scripts/migrate.sh

      # POSTGRES_URL must not be in this environment: config.toml reads it via
      # env(), and the CLI could push the value to the hosted project's secrets.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-docker

      # A 400 means the function booted (config.ts throws at load if POSTGRES_URL
      # is wrong) and validated the empty body.
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/users/signin" \
              -H "Content-Type: application/json" -d '{}' || true)
            [ "$code" = "400" ] && { echo "users/signin answered 400 as expected"; exit 0; }
            echo "attempt $i: HTTP $code"; sleep 6
          done
          echo "::error::users/signin did not answer 400 (521 = project paused on the free plan)"; exit 1

  android:
    name: Android APK
    needs: backend
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 40
    permissions:
      contents: write # publish the android-latest release
    defaults:
      run:
        working-directory: apps/gym_bro_mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 — signing with a throwaway debug key; uninstall the previous build before installing this one."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      - name: Build-time config
        env:
          DART_DEFINES: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
        run: |
          defines="${DART_DEFINES:-}"
          [ -n "$defines" ] || defines='{}'
          echo "$defines" | jq --arg url "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1" \
            '. + {API_BASE_URL: $url}' > "$RUNNER_TEMP/defines.json"
          jq -r 'keys | "dart-defines: " + join(", ")' "$RUNNER_TEMP/defines.json"

      - run: flutter pub get
      # The run number is the versionCode, so each build installs over the last.
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define-from-file="$RUNNER_TEMP/defines.json" \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/gym-bro.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gym-bro-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/gym-bro.apk
          retention-days: 30

      # One rolling pre-release, so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/gym-bro.apk
      - name: Publish android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/gym-bro.apk" \
            --prerelease --target "$DEPLOY_SHA" \
            --title "Android build ${{ github.run_number }}" \
            --notes "Built from $DEPLOY_SHA against https://$SUPABASE_PROJECT_REF.supabase.co."
