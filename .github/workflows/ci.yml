name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/gym_bro_api/**"
      - "apps/gym_bro_mobile/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/gym_bro_api/**"
      - "apps/gym_bro_mobile/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DENO_VERSION: v2.7.8
  FLUTTER_VERSION: 3.41.6
  SUPABASE_CLI_VERSION: 2.84.2

jobs:
  api:
    name: API (check, lint, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/gym_bro_api
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno task check
      - run: deno task lint
      - run: deno task test:unit

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/gym_bro_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart analyze lib
      - run: flutter test --coverage
      # lcov.info only lists files the tests load (most of lib/, through imports).
      - name: Coverage summary
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf "Mobile line coverage (files loaded by tests): %.1f%% (%d/%d lines)\n", lh*100/lf, lh, lf}' \
            coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

  integration:
    name: API integration (local Supabase)
    runs-on: ubuntu-24.04
    needs: api
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/gym_bro_api
    env:
      # The edge runtime reads POSTGRES_URL via env() in config.toml. The CLI
      # maps host.docker.internal to the host on Linux too.
      POSTGRES_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # ghcr.io (setup-cli's registry) briefly answers pulls with `toomanyrequests`;
      # layers already pulled are kept, so a later attempt gets through. ECR Public
      # avoids that but took 15+ minutes to pull the stack.
      - name: Start Supabase
        run: |
          for i in 1 2 3 4; do
            supabase start -x studio,imgproxy,vector,logflare,supavisor && exit 0
            echo "::warning::supabase start failed (attempt $i), retrying in $((i * 30))s"
            supabase stop --no-backup || true
            sleep $((i * 30))
          done
          exit 1

      - name: Read local keys
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          # Throwaway stack, so a fresh seed password per run (setup_db.sh and the tests read it).
          SEED_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$SEED_PASSWORD"
          {
            echo "SEED_PASSWORD=$SEED_PASSWORD"
            echo "API_URL=$API_URL"
            echo "ANON_KEY=$ANON_KEY"
            # Lets the integration tests clean up rows that have no DELETE endpoint.
            echo "DB_URL=$DB_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Apply schema and seed demo data
        run: ./scripts/setup_db.sh --yes && ./scripts/migrate.sh --status

      - name: Serve edge functions
        run: |
          # No CRON_SECRET: the integration tests check /jobs/run answers 503 without one.
          cat > /tmp/functions.env <<ENV
          POSTGRES_URL=$POSTGRES_URL
          ENV
          nohup supabase functions serve --env-file /tmp/functions.env > /tmp/functions.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/functions/v1/users/signin" \
              -H "apikey: $ANON_KEY" -H "Content-Type: application/json" -d '{}' || true)
            if [ "$code" = "400" ] || [ "$code" = "401" ]; then
              echo "Functions ready (HTTP $code after ${i}x2s)"; exit 0
            fi
            sleep 2
          done
          echo "Functions did not become ready"; tail -n 100 /tmp/functions.log; exit 1

      - name: Integration tests
        run: deno task test:integration

      - name: Functions log
        if: failure()
        run: tail -n 200 /tmp/functions.log || true

      - name: Realtime log
        if: failure()
        run: docker logs --tail 200 supabase_realtime_gym_bro_api 2>&1 || true
